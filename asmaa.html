<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator</title>
<link rel="stylesheet" href="asmaa.css"> 
</head>
<body>
  <h1>welcome Asmaa</h1>
  
<div id="calculator">
  <div id="display"></div>
<div class="calculator row">
  <button>C</button>
  <button>(</button> 
  <button>)</button>
  <button>/</button>
</div>
<div class="calculator row">
  <button>7</button>
  <button>8</button>
  <button>9</button>
  <button>*</button>
</div>
<div class="calculator row">
<button>4</button>
<button>5</button>
<button>6</button>
<button>-</button>
</div>
<div class="calculator row">
  <button>1</button>
  <button>2</button>
  <button>3</button>
  <button>+</button>
</div>
<div class="calculator row">
  <button>DEL</button>
  <button>0</button>
  <button>.</button>
  <button>=</button>
</div>
</div>
<script src="asmaa.js"></script>
</body>
</html>
